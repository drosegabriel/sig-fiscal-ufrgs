<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIG Fiscal UFRGS — Gestão Pública & LRF</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Bibliotecas Externas (Gráficos, Excel e Supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- TELA DE LOGIN / ACESSO -->
  <div id="loginOverlay" class="login-overlay">
    <div class="rainbow-border-card login-box">
      <div class="login-inner">
        <div class="badge-ufrgs">UFRGS • FCE • SIG I & II</div>
        <h1 class="gradient-text">SIG Fiscal Inteligente</h1>
        <p class="subtitle">Análise Automatizada da Matriz de Saldos Contábeis (RCL & DTP)</p>

        <form id="loginForm" class="login-form">
          <input type="email" id="loginEmail" placeholder="E-mail institucional (Supabase)" required />
          <input type="password" id="loginPassword" placeholder="Senha" required />
          <button type="submit" class="btn-rainbow">Entrar com Credenciais</button>
        </form>
        <div id="loginError" class="error-msg"></div>

        <div class="divider"><span>ou acesso rápido para demonstração</span></div>

        <div class="quick-roles">
          <button type="button" onclick="entrarModoDemo('tecnico')" class="role-btn">
            🛠️ Técnico Contábil
          </button>
          <button type="button" onclick="entrarModoDemo('secretario')" class="role-btn">
            📊 Secretário / Gestor
          </button>
          <button type="button" onclick="entrarModoDemo('cidadao')" class="role-btn">
            🏛️ Cidadão (Transparência)
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- SISTEMA PRINCIPAL -->
  <div id="appContainer" class="app-container hidden">
    
    <!-- CABEÇALHO -->
    <header class="topbar">
      <div class="brand">
        <div class="logo-orb"></div>
        <div>
          <h2>O Desafio: Gestão Fiscal & Decisão <span class="tag-pill">UFRGS</span></h2>
          <small>Sistemas de Informações Gerenciais • Contabilidade Pública</small>
        </div>
      </div>

      <nav class="nav-tabs">
        <button class="tab-btn active" data-tab="mod1" id="navMod1">Módulo 1: Importação & Auditoria</button>
        <button class="tab-btn" data-tab="mod2" id="navMod2">Módulo 2: Painel RCL & DTP</button>
        <button class="tab-btn" data-tab="mod3" id="navMod3">Módulo 3: Relatórios & Exportação</button>
      </nav>

      <div class="user-controls">
        <select id="roleSwitcher" title="Alternar visão de perfil">
          <option value="tecnico">Perfil: Técnico Contábil</option>
          <option value="secretario">Perfil: Secretário / Gestor</option>
          <option value="cidadao">Perfil: Cidadão (Controle Social)</option>
        </select>
        <button onclick="sairSistema()" class="btn-outline">Sair</button>
      </div>
    </header>

    <!-- BANNER DE CONTEXTO DO MUNICÍPIO ATIVO -->
    <section class
